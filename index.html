<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Shubham & Shreya</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --burgundy: #800020;
            --cream: #fffaf0;
        }

        body, html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Playfair Display', serif;
            background-color: var(--cream);
        }

        /* --- Curtain Animation --- */
        .curtain-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            z-index: 1000;
            display: flex;
            perspective: 1500px;
            pointer-events: none;
        }

        .curtain {
            width: 50%; height: 100%;
            background: var(--burgundy);
            background-image: repeating-linear-gradient(to right, #600018 0%, #800020 5%, #a00028 10%, #800020 15%);
            position: absolute;
            transition: transform 3s ease-in-out;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .curtain.left { left: 0; transform-origin: left; border-right: 2px solid var(--gold); }
        .curtain.right { right: 0; transform-origin: right; border-left: 2px solid var(--gold); }

        .loaded .curtain.left { transform: rotateY(-90deg) scaleX(0.1); }
        .loaded .curtain.right { transform: rotateY(90deg) scaleX(0.1); }

        /* --- Rose Petals --- */
        .petal {
            position: fixed;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            z-index: 99;
            pointer-events: none;
            animation: rain linear infinite;
        }

        @keyframes rain {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Content Layout --- */
        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
        }

        section.visible { opacity: 1; transform: translateY(0); }

        h1 { font-size: 3.5rem; color: var(--burgundy); margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #555; }
        .names { font-style: italic; font-size: 3.5rem; color: var(--gold); white-space: nowrap; }

        /* --- Section 2: Vertical Heart Layout --- */
/* Container changed to Column for vertical stacking */
.couple-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px; /* Space between names and the photo */
    width: 100%;
    margin-top: -30px; /* Optional: Pulls the names slightly higher */
}

/* Updated styling to show the image "as is" but framed gracefully */
.couple-photo {
    width: 250px;       /* Professional portrait size */
    height: 250px;      
    object-fit: cover;  /* Ensures faces stay centered if photo isn't square */
    border-radius: 50%; /* Makes the photo circular */
    border: 4px solid var(--gold); /* Soft gold definition */
    margin: 10px 0;
    box-shadow: 0 12px 25px rgba(0,0,0,0.15); /* Soft, natural shadow */
    display: block;
}

/* Optional: Make the names slightly larger when stacked */
.names { font-size: 3.5rem; }

/* Mobile Adjustments for a Column Layout */
@media (max-width: 600px) {
    .couple-photo {
        width: 190px;
        height: 190px;
    }
    .names { font-size: 2.8rem; }
}
        /* --- Venue & Date --- */
        .venue { font-size: 1.3rem; font-weight: bold; color: #333; margin-bottom: 20px; line-height: 1.6; }
        .date { font-size: 1.8rem; color: var(--burgundy); font-weight: bold; margin-top: 15px;}

        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            font-size: 2rem;
            color: var(--gold);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .names { font-size: 2.5rem; }
            .heart-frame, .heart-frame::before, .heart-frame::after {
                width: 180px;
                height: 180px;
            }
            .heart-frame::before { top: -90px; }
            .heart-frame::after { left: 90px; }
            .couple-photo { width: 165px; height: 165px; }
            .heart-frame { margin: 80px 0; }
        }
    </style>
</head>
<body>

    <div class="curtain-container" id="curtainFrame">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
    </div>

    <div id="petal-container"></div>

    <section id="page1">
        <h1 class="animate-text">Wedding Invitation</h1>
        <p>Grace us with your presence to make our day even more special.</p>
        <div class="scroll-down">↓</div>
    </section>
    <section id="page2">
    <div class="couple-container">
        <div class="names">Shubham</div>
        
        <img src="Polish_20260309_225604278.png"alt="Shubham and Shreya" class="couple-photo animate-text">
        
        <div class="names">Shreya</div>
    </div>
    <div class="scroll-down">↓</div>
</section>
    <section id="page3">
        <div class="venue">
            Amit Palace<br>
            <span style="font-weight: normal; font-size: 0.95rem; color: #555;">
                Manchar - Bhimashankar Rd, Dhondmal, Shindewadi,<br>
                Ghodegaon, Pune, Maharashtra 412408
            </span>
        </div>

        <div style="margin: 20px 0;">
            <a href="https://maps.app.goo.gl/YourActualLinkHere" target="_blank">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://maps.app.goo.gl/YourActualLinkHere" 
                     alt="Scan for Directions" 
                     style="border: 2px solid var(--gold); padding: 5px; background: white;">
            </a>
            <p style="font-size: 0.8rem; margin-top: 5px; color: #888;">Tap or Scan for Location</p>
        </div>

        <div class="date">March 16, 2026</div>
        <p style="font-size: 1.2rem;">10:00 AM Onwards</p>
    </section>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 500);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.3 });

        document.querySelectorAll('section').forEach(section => {
            observer.observe(section);
        });

        function createPetal() {
            const container = document.getElementById('petal-container');
            const petal = document.createElement('div');
            petal.classList.add('petal');
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            container.appendChild(petal);
            setTimeout(() => petal.remove(), 5000);
        }
        setInterval(createPetal, 200);
    </script>
</body>
</html>
