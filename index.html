<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --burgundy: #800020;
            --text-color: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Playfair Display', serif;
            background-color: #fffaf0;
        }

        /* --- Curtain Animation --- */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1000;
            display: flex;
            perspective: 1500px;
            pointer-events: none;
        }

        .curtain {
            width: 50%;
            height: 100%;
            background: var(--burgundy);
            background-image: repeating-linear-gradient(to right, #600018 0%, #800020 5%, #a00028 10%, #800020 15%);
            position: absolute;
            top: 0;
            transition: transform 3s ease-in-out;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .curtain.left {
            left: 0;
            transform-origin: left;
            border-right: 2px solid var(--gold);
        }

        .curtain.right {
            right: 0;
            transform-origin: right;
            border-left: 2px solid var(--gold);
        }

        /* Opening Animation Triggered on Load */
        .loaded .curtain.left { transform: rotateY(-90deg) scaleX(0.1); }
        .loaded .curtain.right { transform: rotateY(90deg) scaleX(0.1); }

        /* --- Rose Petal Rain --- */
        .petal {
            position: fixed;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            z-index: 99;
            pointer-events: none;
            animation: rain linear infinite;
        }

        @keyframes rain {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Content Styling --- */
        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1cm;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h1 { font-size: 3.5rem; margin-bottom: 20px; color: var(--burgundy); }
        p { font-size: 1.5rem; color: #555; max-width: 600px; }
        .names { font-style: italic; font-size: 4rem; color: var(--gold); }
        .and-symbol { font-size: 2rem; margin: 10px 0; display: block; }
        .venue { font-size: 1.4rem; font-weight: bold; line-height: 1.5; 
            max-width: 85%;}
        .date { font-size: 1.6rem; 
            margin-top: 15px; 
            color: var(--burgundy); }

        .qr-placeholder {
            width: 150px;
            height: 150px;
            background: #eee;
            border: 2px solid var(--gold);
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        /* --- Scroll Indicator --- */
        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            font-size: 2rem;
            color: var(--gold);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
            60% {transform: translateX(-50%) translateY(-5px);}
        }

        /* Animation for letters */
        .animate-text {
            animation: fadeIn 2s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; filter: blur(10px); }
            to { opacity: 1; filter: blur(0); }
        }
        .couple-container {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 40px;
    width: 100%;
}

/* The Gold Heart Frame */
.heart-frame {
    position: relative;
    width: 280px;  /* Increased Size */
    height: 280px;
    background-color: var(--gold);
    /* This creates the heart shape perfectly */
    clip-path: path('M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402m5.726-20.583c-2.203 0-4.446 1.042-5.726 3.146-1.28-2.104-3.523-3.146-5.726-3.146-3.277 0-6.274 2.16-6.274 6.181 0 4.671 4.545 9.176 12 16.808 7.455-7.632 12-12.137 12-16.808 0-4.021-2.997-6.181-6.274-6.181z');
    transform: scale(10); /* Scales the SVG path to fit the 280px container */
    display: flex;
    justify-content: center;
    align-items: center;
    animation: heartbeat 1.5s infinite ease-in-out;
}

/* Legacy CSS Heart Method (Better for most browsers) */
.heart-frame {
    position: relative;
    width: 250px;
    height: 250px;
    background-color: var(--gold);
    transform: rotate(-45deg);
    margin: 50px 0;
}

.heart-frame::before,
.heart-frame::after {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    background-color: var(--gold);
    border-radius: 50%;
}
.heart-frame::before { top: -125px; left: 0; }
.heart-frame::after { top: 0; left: 125px; }

/* The Image - Shrunk slightly to show the Gold Heart behind it */
.couple-photo {
    position: absolute;
    width: 90%;  /* Makes image 90% of the heart size to show gold border */
    height: 90%;
    object-fit: cover;
    z-index: 10;
    transform: rotate(45deg); /* Keeps image straight while heart is rotated */
    border-radius: 50% 50% 0 0; /* Optional: rounds the top of the photo to match heart */
    clip-path: inherit; /* Matches the heart shape */
}

@keyframes heartbeat {
    0% { transform: rotate(-45deg) scale(1); }
    15% { transform: rotate(-45deg) scale(1.1); }
    30% { transform: rotate(-45deg) scale(1); }
    45% { transform: rotate(-45deg) scale(1.15); }
    60% { transform: rotate(-45deg) scale(1); }
}

/* Mobile Fix */
@media (max-width: 768px) {
    .couple-container { gap: 10px; }
    .names { font-size: 1.5rem; }
    .heart-frame, .heart-frame::before, .heart-frame::after {
        width: 120px;
        height: 120px;
    }
    .heart-frame::before { top: -60px; }
    .heart-frame::after { left: 60px; }
}
    </style>
</head>
<body>

    <div class="curtain-container" id="curtainFrame">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
    </div>

    <div id="petal-container"></div>

<section id="page1">
    <h1 class="animate-text">Wedding Invitation</h1>
    <p>Grace us with your presence to make our day even more special for us.</p>
    <div class="scroll-down">↓</div>
</section>

<section id="page2">
    <div class="couple-container">
        <div class="names">Shubham</div>
        
        <div class="heart-frame animate-text">
            <img src="DSC_0418.JPG" alt="Shubham and Shreya" class="couple-photo">
        </div>
        
        <div class="names">Shreya</div>
    </div>
    <div class="scroll-down">↓</div>
</section>
        <section id="page3">
        <div class="venue">
            Amit Palace<br>
            <span style="font-weight: normal; font-size: 1rem; color: #555;">
                Manchar - Bhimashankar Rd, Dhondmal, Shindewadi,<br>
                Ghodegaon, Pune, Maharashtra 412408
            </span>
        </div>

        <div style="margin: 20px 0;">
            <a href="https://maps.app.goo.gl/xQF9wjDkDLxKSugM7" target="_blank">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=INSERT_GOOGLE_MAPS_LINK_HERE" 
                     alt="Scan for Directions" 
                     style="border: 1px solid var(--gold); padding: 5px; background: white;">
            </a>
            <p style="font-size: 0.8rem; margin-top: 5px; color: #888;">Tap or Scan for Location</p>
        </div>

        <div class="date">March 16, 2026</div>
        <p style="font-size: 1.2rem;">10 AM Onwards</p>
    </section>

    <script>
        // Trigger Curtain Opening
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 500);
        });

        // Intersection Observer for Scroll Animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.3 });

        document.querySelectorAll('section').forEach(section => {
            observer.observe(section);
        });

        // Rose Petal Generator
        function createPetal() {
            const container = document.getElementById('petal-container');
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            
            container.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, 5000);
        }

        setInterval(createPetal, 200);
    </script>
</body>
</html>
