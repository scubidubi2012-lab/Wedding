<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation | Shubham & Shreya</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --burgundy: #800020;
            --cream: #fffaf0;
            --text-gray: #555;
        }

        body, html {
            margin: 0; padding: 0;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif; /* Default body font */
            background-color: var(--cream);
        }

        /* --- Curtain Animation --- */
        .curtain-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            z-index: 1000;
            display: flex;
            perspective: 1500px;
            pointer-events: none;
        }
        .curtain {
            width: 50%; height: 100%;
            background: var(--burgundy);
            background-image: repeating-linear-gradient(to right, #600018 0%, #800020 5%, #a00028 10%, #800020 15%);
            position: absolute;
            transition: transform 3s ease-in-out;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }
        .curtain.left { left: 0; transform-origin: left; border-right: 2px solid var(--gold); }
        .curtain.right { right: 0; transform-origin: right; border-left: 2px solid var(--gold); }
        .loaded .curtain.left { transform: rotateY(-90deg) scaleX(0.1); }
        .loaded .curtain.right { transform: rotateY(90deg) scaleX(0.1); }

        /* --- Rose Petals --- */
        .petal {
            position: fixed;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            z-index: 99;
            pointer-events: none;
            animation: rain linear infinite;
        }
        @keyframes rain {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Layout Sections --- */
        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
        }
        section.visible { opacity: 1; transform: translateY(0); }

        h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--burgundy); margin-bottom: 10px; }
        .intro-p { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; color: var(--text-gray); font-weight: 300; letter-spacing: 1px;}
        .names { font-family: 'Playfair Display', serif; font-style: italic; font-size: 3.5rem; color: var(--gold); }

        /* --- Section 2: Image As-Is --- */
        .couple-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .couple-photo {
            width: auto;
            max-width: 85%;
            max-height: 50vh;
            display: block;
            margin: 10px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* --- Page 3: Venue Styling --- */
        .venue-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--burgundy);
            margin-bottom: 15px;
        }
        .address-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            line-height: 1.8;
            color: #333;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        .qr-container {
            margin: 10px 0;
            padding: 12px;
            background: white;
            border: 1px solid var(--gold);
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .date-box {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--burgundy);
            font-weight: 700;
            margin-top: 15px;
            border-top: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);
            padding: 10px 40px;
        }
        .time-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-gray);
            margin-top: 10px;
        }

        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            font-size: 2rem;
            color: var(--gold);
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; }
            .names { font-size: 2.8rem; }
            .date-box { font-size: 1.8rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="curtain-container" id="curtainFrame">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
    </div>

    <div id="petal-container"></div>

    <section id="page1">
        <h1>Wedding Invitation</h1>
        <p class="intro-p">Grace us with your presence to make our day even more special.</p>
        <div class="scroll-down">↓</div>
    </section>

    <section id="page2">
        <div class="couple-container">
            <div class="names">Shubham</div>
            <img src="DSC_0418.JPG" alt="Shubham and Shreya" class="couple-photo">
            <div class="names">Shreya</div>
        </div>
        <div class="scroll-down">↓</div>
    </section>

    <section id="page3">
        <div class="venue-title">Amit Palace</div>
        <div class="address-text">
            Manchar - Bhimashankar Rd, Dhondmal,<br>
            Shindewadi, Ghodegaon,<br>
            Pune, Maharashtra 412408
        </div>

        <div class="qr-container">
            <a href="https://maps.app.goo.gl/9rugGwMSPimCAK7a8" target="https://maps.app.goo.gl/9rugGwMSPimCAK7a8">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=https://maps.app.goo.gl/3Vv8i" 
                     alt="Tap for Location">
            </a>
        </div>
        <p style="font-size: 0.75rem; color: #999; margin-top: 5px;">Tap or Scan for Navigation</p>

        <div class="date-box">March 16, 2026</div>
        <div class="time-text">10:00 AM Onwards</div>
    </section>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => { document.body.classList.add('loaded'); }, 500);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('visible'); }
            });
        }, { threshold: 0.3 });

        document.querySelectorAll('section').forEach(section => { observer.observe(section); });

        function createPetal() {
            const container = document.getElementById('petal-container');
            const petal = document.createElement('div');
            petal.classList.add('petal');
            const size = Math.random() * 15 + 10 + 'px';
            petal.style.width = size; petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            container.appendChild(petal);
            setTimeout(() => petal.remove(), 5000);
        }
        setInterval(createPetal, 200);
    </script>
</body>
</html>
